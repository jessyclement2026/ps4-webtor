name: Build PS4 WebTor Proxy Payload

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            build-essential \
            clang-18 \
            lld-18 \
            llvm-18 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            meson \
            socat \
            git \
            wget \
            unzip \
            python3

      - name: Download ps4-payload-sdk
        run: |
          wget -q https://github.com/ps4-payload-dev/sdk/releases/latest/download/ps4-payload-sdk.zip
          unzip -oq ps4-payload-sdk.zip

      - name: Build payload
        env:
          PS4_PAYLOAD_SDK: ${{ github.workspace }}/ps4-payload-sdk
          PS4SDK: ${{ github.workspace }}/ps4-payload-sdk
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload webtor-ps4.elf artifact
        uses: actions/upload-artifact@v4
        with:
          name: webtor-ps4-elf
          path: webtor-ps4.elf
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PS4 WebTor Browser Proxy Payload ${{ github.ref_name }} (webtor-ps4.elf)
          files: webtor-ps4.elf
          generate_release_notes: true
          body: |
            ## Native WebTor Browser Proxy Payload for Jailbroken PS4 (`webtor-ps4.elf`)

            A companion web proxy payload with a built-in web browser UI for jailbroken PlayStation 4 consoles, allowing you to browse `.onion` hidden services and modern HTTPS websites directly in the stock PS4 browser via **[tor-ps4](https://github.com/jessyclement2026/tor-ps4)**.

            ### Key Features
            - **Built-in Web UI:** Accessible directly from the stock PS4 Internet Browser.
            - **`.onion` & Modern TLS Support:** Uses statically linked OpenSSL over `tor-ps4`'s local SOCKS5 proxy (`127.0.0.1:9050`).
            - **Memory Optimized:** Uses a custom `mmap`-backed allocator to bypass GoldHEN's static heap limits.

            ### Quick Start Guide
            1. Make sure **`tor-ps4.elf`** is already running in the background (`127.0.0.1:9050`).
            2. Upload `webtor-ps4.elf` via FTP to `/data/payloads/webtor-ps4.elf` and launch it from GoldHEN's PayLoader.
            3. Open the PS4 Internet Browser and navigate to the local WebTor UI address.

            > **⚠️ Important:** Make sure **Automatic Downloads / System Software Updates** are completely disabled in **PS4 Settings → System → Automatic Downloads** before connecting online so your console does not accidentally upgrade its firmware.
